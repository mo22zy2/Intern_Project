{% extends "auth/master.html" %}
{% load i18n %}

{% block title %}{% trans "Register" %}{% endblock %}

{% block content %}

<div class="register-container">

    <div class="register-card">

        <h1>Create Account</h1>
        <p>Join us and start ordering your favorite meals.</p>

        <form method="POST">
            {% csrf_token %}



            <div class="form-grid">

                <input type="text" name="username" placeholder="Username" value="{{ request.POST.username }}" required>

                <input type="email" name="email" placeholder="Email" value="{{ request.POST.email }}" required>

                <input type="password" name="password" placeholder="Password" required>

                <input type="password" name="confirm_password" placeholder="Confirm Password" required>

                <input type="text" name="first_name" placeholder="First Name" value="{{ request.POST.first_name }}" required>

                <input type="text" name="last_name" placeholder="Last Name" value="{{ request.POST.last_name }}" required>

                <input type="text" name="phone" placeholder="Phone Number" value="{{ request.POST.phone }}" required>

                <input type="date" name="birth" value="{{ request.POST.birth }}" required>

            </div>

            <button type="submit" class="register-btn">
                Register
            </button>

        </form>

    </div>

</div>



{% endblock %}
