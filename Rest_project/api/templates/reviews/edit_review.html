{% extends "master.html" %}
{% load i18n %}

{% block title %}{% trans "Edit Review" %}{% endblock %}

{% block content %}

<div class="reviews-page">

    <h1>Edit Review</h1>

    <p><strong>{{ review.menu.item.item_name }}</strong></p>

    <form method="POST" action="{% url 'edit_review' review.id %}" class="review-form">
        {% csrf_token %}

        <div class="form-group">
            <label>Rating</label>
            <div class="star-select">
                {% for i in "12345" %}
                <label class="star-label">
                    <input type="radio" name="rating" value="{{ i }}" {% if review.rating == i|add:0 %}checked{% endif %}>
                    {{ i }}
                </label>
                {% endfor %}
            </div>
        </div>

        <div class="form-group">
            <label>Comment (optional)</label>
            <textarea name="comment" class="form-input" rows="4">{{ review.comment }}</textarea>
        </div>

        <div class="form-actions">
            <button type="submit" class="btn">Save</button>
            <a href="{% url 'my_reviews' %}" class="btn btn-secondary">Cancel</a>
        </div>
    </form>

</div>

{% endblock %}
