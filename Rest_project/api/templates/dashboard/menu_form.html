{% extends "dashboard/base.html" %}
{% load i18n %}

{% block admin_content %}
<h1>{% trans "Add Menu Item" %}</h1>

<div class="admin-form-card">
    <form method="POST">
        {% csrf_token %}

        <label for="item_name">{% trans "Item Name" %}</label>
        <input type="text" name="item_name" id="item_name" class="form-input" required>

        <label for="category">{% trans "Category" %}</label>
        <select name="category" id="category" class="form-input" required>
            <option value="">{% trans "Select a category" %}</option>
            {% for cat in categories %}
            <option value="{{ cat.id }}">{{ cat.category_name }}</option>
            {% endfor %}
        </select>

        <label for="price">{% trans "Price (EGP)" %}</label>
        <input type="number" name="price" id="price" step="0.01" min="0" class="form-input" required>

        <label for="image_url">{% trans "Image URL" %}</label>
        <input type="url" name="image_url" id="image_url" class="form-input" placeholder="https://...">

        <label for="stock_count">{% trans "Stock Count" %}</label>
        <input type="number" name="stock_count" id="stock_count" value="0" min="0" class="form-input">

        <label class="checkbox-label">
            <input type="checkbox" name="available" checked>
            {% trans "Available" %}
        </label>

        <button type="submit" class="btn">{% trans "Add Item" %}</button>
        <a href="{% url 'admin_menu_list' %}" class="btn btn-secondary">{% trans "Cancel" %}</a>
    </form>
</div>
{% endblock %}
